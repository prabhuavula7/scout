<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OG image source - not a real page, do not link</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }
    body {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .og-bg {
      position: absolute;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      filter: blur(70px);
      opacity: 0.55;
    }
    .og-blob {
      position: absolute;
      border-radius: 999px;
    }
    .og-blob-a {
      width: 480px;
      height: 480px;
      left: -100px;
      top: -160px;
      background: var(--color-accent-400);
    }
    .og-blob-b {
      width: 440px;
      height: 440px;
      right: -80px;
      top: -100px;
      background: var(--color-aether-gold);
    }
    .og-blob-c {
      width: 420px;
      height: 420px;
      left: 40%;
      bottom: -220px;
      background: var(--color-accent-500);
    }
    .og-wrap {
      width: 100%;
      max-width: 1000px;
      padding: 0 60px;
      text-align: center;
    }
    .og-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-weight: 700;
      font-size: 1.4rem;
      margin-bottom: 28px;
      letter-spacing: -0.01em;
    }
    .og-brand svg {
      width: 40px;
      height: 40px;
    }
    .og-wrap h1 {
      font-family: var(--font-serif);
      font-size: 3.1rem;
      line-height: 1.1;
      letter-spacing: -0.02em;
      font-weight: 500;
      margin: 0 0 22px;
    }
    .og-wrap h1 em {
      font-style: italic;
      color: var(--color-accent-600);
    }
    .og-wrap p {
      font-size: 1.25rem;
      color: var(--fg-muted);
      margin: 0 auto;
      max-width: 780px;
    }
  </style>
</head>
<body>
  <div class="og-bg" aria-hidden="true">
    <div class="og-blob og-blob-a"></div>
    <div class="og-blob og-blob-b"></div>
    <div class="og-blob og-blob-c"></div>
  </div>
  <div class="og-wrap">
    <div class="og-brand">
      <svg viewBox="0 0 32 32" fill="none">
        <circle cx="16" cy="16" r="15" fill="#C7522A"/>
        <path d="M21.5 10.5 17.8 17.8 10.5 21.5 14.2 14.2 21.5 10.5Z" fill="#FFFAF5"/>
        <circle cx="16" cy="16" r="2" fill="#C7522A"/>
        <circle cx="16" cy="16" r="1" fill="#FFFAF5"/>
      </svg>
      Scout
    </div>
    <h1>Understand any enterprise platform <em>in minutes</em>.</h1>
    <p>A cited integration blueprint and a real chat assistant, in a local web app. Local-first, MIT licensed, no telemetry.</p>
  </div>
</body>
</html>
